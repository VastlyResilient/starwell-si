/* Layout: a quiet three-area workspace. Company sidebar | document (independent scroll) | Ask Starwell panel
   (reserved space on desktop; drawer below 1200px; full sheet on phones). Visual language: Figtree with tight
   tracking, black pill bar, white and #f2f2f2 surfaces, one cyan accent. Semantic note colors carry meaning only. */
:root {
  --app: #ffffff; --side: #f2f2f2; --doc: #ffffff; --assist: #f2f2f2; --hover: #e9e9e9; --sel: #ebebeb;
  --ink: #000000; --ink-soft: #2e2e2e; --muted: #6b6b6b; --faint: #a8a8a8; --line: #ededed; --line-strong: #dedede;

  --pill: #000000; --pill-ink: #ffffff; --pill-field: #1d1d1d; --pill-muted: #8c8c8c;
  --pain: #c2412b; --pain-bg: #fdeae5; --neck: #b26a00; --neck-bg: #fdf0d8; --emo: #b03a73; --emo-bg: #fbe6f0;
  --fact: #1f74a8; --fact-bg: #e3f3fb; --dec: #2a9a30; --dec-bg: #e4f5e5; --q: #6d6d6d; --q-bg: #efefef;
  --opp: #0d8fb0; --opp-bg: #e0f6fc; --quote: #8a6a12; --quote-bg: #f8efd6;
  --ok: #2a9a30; --ok-bg: #e4f5e5; --warn: #b26a00; --warn-bg: #fdf0d8; --bad: #c2412b; --bad-bg: #fdeae5; --info: #1f74a8; --info-bg: #e3f3fb;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.07);
  --f: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --fw-light: 388; --fw-regular: 470; --fw-medium: 500; --fw-semibold: 511; --fw-bold: 577; --fw-black: 783;
  --tr-display: -0.05em; --tr-title: -0.035em; --tr-heading: -0.02em; --tr-body: -0.008em; --tr-ui: -0.008em; --tr-meta: -0.012em;
  --ease-reveal: cubic-bezier(.22, 1, .36, 1); --ease-settle: cubic-bezier(.16, 1, .30, 1);

}

  --pain: #f2917d; --pain-bg: #351c16; --neck: #eab45e; --neck-bg: #32250f; --emo: #ec9cc4; --emo-bg: #361b29;
  --fact: #7cc6ee; --fact-bg: #13283a; --dec: #7ed283; --dec-bg: #162c18; --q: #b9b9b9; --q-bg: #262626;
  --opp: #6fd7f0; --opp-bg: #0f2b33; --quote: #e5c573; --quote-bg: #302812;
  --ok: #7ed283; --ok-bg: #162c18; --warn: #eab45e; --warn-bg: #32250f; --bad: #f2917d; --bad-bg: #351c16; --info: #7cc6ee; --info-bg: #13283a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --app: #0c0c0c; --side: #141414; --doc: #0f0f0f; --assist: #161616; --hover: #1f1f1f; --sel: #222222;
  --ink: #f4f4f4; --ink-soft: #dcdcdc; --muted: #9b9b9b; --faint: #5f5f5f; --line: #222222; --line-strong: #323232;
  --btn: #ffffff; --btn-ink: #000000; --focus: #38c6ec; --accent: #38c6ec; --accent-deep: #0db5ed;
  --pill: #1a1a1a; --pill-ink: #ffffff; --pill-field: #262626; --pill-muted: #8c8c8c;
  --pain: #f2917d; --pain-bg: #351c16; --neck: #eab45e; --neck-bg: #32250f; --emo: #ec9cc4; --emo-bg: #361b29;
  --fact: #7cc6ee; --fact-bg: #13283a; --dec: #7ed283; --dec-bg: #162c18; --q: #b9b9b9; --q-bg: #262626;
  --opp: #6fd7f0; --opp-bg: #0f2b33; --quote: #e5c573; --quote-bg: #302812;
  --ok: #7ed283; --ok-bg: #162c18; --warn: #eab45e; --warn-bg: #32250f; --bad: #f2917d; --bad-bg: #351c16; --info: #7cc6ee; --info-bg: #13283a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; background: var(--app); }
body { color: var(--ink); font: 15px/1.55 var(--f); -webkit-font-smoothing: antialiased; overflow: hidden; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.label { font: 500 11px/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* ---------- AppShell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) var(--assist-w); height: 100%; }
.app.no-assist { grid-template-columns: var(--side-w) minmax(0, 1fr); }
.app.no-assist .assist { display: none; }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 14px 12px 12px max(12px, env(safe-area-inset-left, 0px)); gap: 6px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.center { flex: 1; overflow: auto; background: var(--doc); border-top: 1px solid var(--line); overscroll-behavior: contain; }
.assist { padding: 10px 12px 12px 0; min-height: 0; display: flex; }
.scrim { position: fixed; inset: 0; background: rgba(20,19,17,.38); z-index: 30; }

/* Sidebar */
.wordmark { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px 10px; text-decoration: none; }
.wordmark b { font: 700 20px/1 var(--f); letter-spacing: -0.02em; }
.wordmark span { font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.switcher { position: relative; }
.switch-btn { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) 16px; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--line); background: var(--doc); border-radius: 12px; cursor: pointer; }
.switch-btn:hover { border-color: var(--line-strong); }
.mono-badge { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--sel); font: 600 13px/1 var(--f); color: var(--ink); }
.switch-btn small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.switch-btn b { display: block; font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop { position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 6px); background: var(--doc); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; max-height: 60vh; overflow: auto; }
.pop-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; }
.pop-item:hover, .pop-item[aria-current="true"] { background: var(--sel); }
.pop-item .mono-badge { width: 24px; height: 24px; font-size: 11px; border-radius: 6px; }
.pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.pop form { padding: 8px; display: grid; gap: 8px; }
.newmemo { margin: 6px 0 4px; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav a, .side-link { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14.5px; }
.nav a:hover, .side-link:hover { background: var(--hover); }
.nav a[aria-current="page"] { background: var(--sel); font-weight: 600; }
.nav a .cnt { margin-left: auto; font: 400 12px/1 var(--mono); color: var(--faint); }
.spk { all: unset; cursor: pointer; font: 500 11.5px/1.5 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-radius: 4px; }
.spk:hover { color: var(--ink); text-decoration: underline; }
.spk:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.nav svg { flex: none; color: var(--muted); }
.side-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.recent { display: flex; flex-direction: column; gap: 1px; overflow: auto; min-height: 0; flex: 1; }
.recent a { display: block; padding: 6px 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent a:hover { background: var(--hover); }
.recent a[aria-current="page"] { background: var(--sel); }
.recent .empty-s { padding: 4px 10px; color: var(--faint); font-size: 13.5px; }
.side-foot { border-top: 1px solid var(--line); padding: 10px 6px 0; display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.side-foot img { width: 28px; height: 28px; border-radius: 50%; flex: none; }
.side-foot b { display: block; font-weight: 600; line-height: 1.2; }
.side-foot small { color: var(--muted); font-size: 12px; }

/* Top bar + tabs */
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px; padding-top: max(10px, env(safe-area-inset-top, 0px)); }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 9px; background: transparent; cursor: pointer; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.menu-btn { display: none; }
.search { position: relative; flex: 1; min-width: 0; }
.search input { width: 100%; height: 40px; padding: 0 64px 0 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--sel); }
.search input:focus { outline: none; background: var(--doc); border-color: var(--line-strong); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.search > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 500 11px/1 var(--mono); color: var(--faint); border: 1px solid var(--line-strong); border-radius: 5px; padding: 3px 5px; background: var(--doc); }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 40; background: var(--doc); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; max-height: min(70vh, 520px); overflow: auto; }
.results .grp { padding: 8px 10px 4px; }
.res { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.res:hover, .res[aria-selected="true"] { background: var(--sel); }
.res b { display: block; font-weight: 500; font-size: 14px; }
.res small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.res mark { background: var(--quote-bg); color: inherit; border-radius: 3px; }
.res.ask { display: flex; gap: 10px; align-items: center; font-weight: 500; }
.ask-btn { white-space: nowrap; }
.tabs { display: flex; gap: 2px; padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; max-width: 240px; padding: 8px 6px 9px 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 10px 10px 0 0; text-decoration: none; font-size: 13.5px; color: var(--muted); white-space: nowrap; flex: none; }
.tab span { overflow: hidden; text-overflow: ellipsis; }
.tab:hover { color: var(--ink); background: var(--hover); }
.tab[aria-current="page"] { background: var(--doc); border-color: var(--line); color: var(--ink); font-weight: 500; position: relative; top: 1px; }
.tab button { border: 0; background: transparent; width: 20px; height: 20px; border-radius: 5px; cursor: pointer; color: var(--faint); display: grid; place-items: center; }
.tab button:hover { background: var(--sel); color: var(--ink); }
.tab .home-ic { padding-right: 6px; }

/* Buttons + chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--doc); color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; font: 500 12px/1.75 var(--f); background: var(--sel); color: var(--muted); white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.c-pain { background: var(--pain-bg); color: var(--pain); } .c-neck { background: var(--neck-bg); color: var(--neck); } .c-emo { background: var(--emo-bg); color: var(--emo); }
.c-fact { background: var(--fact-bg); color: var(--fact); } .c-dec { background: var(--dec-bg); color: var(--dec); } .c-q { background: var(--q-bg); color: var(--q); }
.c-opp { background: var(--opp-bg); color: var(--opp); } .c-quote { background: var(--quote-bg); color: var(--quote); }
.c-ok { background: var(--ok-bg); color: var(--ok); } .c-warn { background: var(--warn-bg); color: var(--warn); } .c-bad { background: var(--bad-bg); color: var(--bad); } .c-info { background: var(--info-bg); color: var(--info); }
.c-line { background: transparent; border: 1px solid var(--line-strong); }

/* ---------- Views ---------- */
.view { max-width: 920px; margin: 0 auto; padding: 30px max(20px, env(safe-area-inset-right, 0px)) 120px max(20px, env(safe-area-inset-left, 0px)); }
.view.wide { max-width: 1060px; }
.page-h { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-bottom: 22px; }
.page-h > div { flex: 1 1 320px; min-width: 0; }
.page-h h1 { font-size: clamp(24px, 3vw, 30px); font-weight: 700; line-height: 1.15; }
.page-h p { color: var(--muted); margin-top: 6px; max-width: 64ch; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.crumb a { text-decoration: none; } .crumb a:hover { text-decoration: underline; }
.sec { margin-top: 30px; }
.sec > h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.sec > .lede { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.card { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--doc); padding: 16px 18px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.grid2 .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r-card); }
.empty h3 { color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }
.notice { padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--ink); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.notice.info { background: var(--info-bg); } .notice.bad { background: var(--bad-bg); }
.notice > span { flex: 1 1 240px; min-width: 0; }
.signin { max-width: 560px; margin: clamp(10px, 7vh, 70px) auto 0; }
.signin h1 { font-size: clamp(26px, 3.4vw, 32px); font-weight: 700; }
.seats { display: grid; gap: 10px; margin-top: 22px; }
.seat { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: center; text-align: left; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-card); background: var(--doc); cursor: pointer; }
.seat:hover:not(:disabled) { border-color: var(--ink); }
.seat:disabled { opacity: .55; cursor: not-allowed; }
.seat b { display: block; font-size: 17px; font-weight: 600; }
.seat small { color: var(--muted); font-size: 13px; }
.seat-badge { width: 44px; height: 44px; font-size: 16px; border-radius: 12px; }
.side-foot .notme { all: unset; cursor: pointer; color: var(--muted); font-size: 12px; text-decoration: underline; }
.uploader { margin-bottom: 14px; }

/* Form fields */
.field label, .flabel { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.field label em { font-style: normal; color: var(--bad); }
.field input, .field select, .field textarea, .inp { width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--doc); }
.field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.err { color: var(--bad); font-size: 13px; margin-top: 4px; }
.hint { color: var(--muted); font-size: 13.5px; margin-top: 4px; }

/* Overview */
.prio { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); }
.prio:first-of-type { border-top: 0; }
.prio .n { font: 600 14px/28px var(--mono); color: var(--muted); }
.prio h3 { font-size: 16.5px; font-weight: 600; line-height: 1.35; }
.prio p { margin-top: 4px; color: var(--muted); }
.row-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 13.5px; }
.feed li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
.feed img { width: 22px; height: 22px; border-radius: 50%; }
.feed small { color: var(--faint); }
.gaps { margin: 0; padding-left: 18px; display: grid; gap: 7px; }
.profile { display: grid; grid-template-columns: 150px minmax(0, 1fr); border-top: 1px solid var(--line); font-size: 14px; }
.profile dt, .profile dd { margin: 0; padding: 9px 0; border-bottom: 1px solid var(--line); }
.profile dt { color: var(--muted); padding-right: 12px; }
.profile dd { min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 520px) { .profile { grid-template-columns: minmax(0, 1fr); } .profile dt { border: 0; padding-bottom: 0; } }

/* Lists */
.list { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) 130px 120px; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.lrow:first-child { border-top: 0; }
.lrow:hover { background: var(--hover); }
.lrow h3 { font-size: 15.5px; font-weight: 600; line-height: 1.35; }
.lrow small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.lrow .d { font: 400 12.5px/1.3 var(--mono); color: var(--muted); }
@media (max-width: 640px) { .lrow { grid-template-columns: minmax(0, 1fr) auto; } .lrow .who { display: none; } }

/* Memo reader */
.memo-h { margin-bottom: 18px; }
.memo-h h1 { font-size: clamp(25px, 3.2vw, 32px); font-weight: 700; line-height: 1.15; margin: 4px 0 8px; }
.memo-h .headline { color: var(--muted); font-size: 16px; max-width: 70ch; }
.facts-row { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; font-size: 13.5px; }
.facts-row div { min-width: 0; }
.facts-row b { display: block; font-weight: 500; font-size: 14px; }
.viewbar { position: sticky; top: 0; z-index: 4; background: var(--doc); display: flex; gap: 8px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); margin: 22px 0 24px; }
.seg { display: inline-flex; gap: 2px; background: var(--sel); padding: 3px; border-radius: 10px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--doc); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.memo-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.meta-line { color: var(--muted); font-size: 14.5px; }
.linkish { all: unset; cursor: pointer; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.linkish:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.headline.clamp { margin-top: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15.5px; }
.menu-wrap { position: relative; }
.pop-r { left: auto; right: 0; min-width: 240px; }
.pop-item.danger { color: var(--bad); }
.chk { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.chk:hover { background: var(--sel); }
.chk input { width: 16px; height: 16px; accent-color: var(--btn); margin: 0; }
.chk .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--nc); flex: none; }
.vtabs { display: flex; gap: 22px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: auto; }
.vtabs::-webkit-scrollbar { display: none; }
.vtabs button { border: 0; background: transparent; padding: 8px 0 9px; font-size: 14.5px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -11px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.vtabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.vtabs button:disabled { opacity: .45; cursor: not-allowed; }
.vtabs .cnt { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: 999px; background: var(--sel); color: var(--muted); }
details.note { font-size: 14px; }
details.note summary { list-style: none; display: flex; gap: 8px; align-items: baseline; padding: 3px 8px; border-radius: 6px; cursor: pointer; color: var(--muted); min-width: 0; }
details.note summary::-webkit-details-marker { display: none; }
details.note summary:hover { background: var(--app); }
details.note i { width: 7px; height: 7px; border-radius: 50%; background: var(--nc); flex: none; align-self: center; }
details.note b { color: var(--nc); font-weight: 600; font-size: 12.5px; flex: none; }
details.note .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
details.note[open] summary { background: var(--app); color: var(--ink); }
details.note[open] .t { white-space: normal; }
details.note small { display: block; color: var(--faint); font-size: 12.5px; padding: 2px 8px 4px 23px; }
.notes { gap: 0; margin: 2px 0 6px; }
.turn .who .ev { border-color: transparent; background: transparent; color: var(--faint); }
.turn:hover .who .ev, .turn .who .ev:focus-visible { border-color: var(--line-strong); }
.notefilter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
.notefilter button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12.5px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.notefilter button[aria-pressed="true"] { color: var(--ink); border-color: var(--line-strong); background: var(--sel); }
.notefilter button i { width: 8px; height: 8px; border-radius: 50%; }
.doc { font-size: 16.5px; line-height: 1.7; max-width: 70ch; }
.osec { margin-bottom: 34px; scroll-margin-top: 70px; }
.osec > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 4px; }
.osec h3 { font-size: 19px; font-weight: 600; line-height: 1.3; }
.osec .sum { color: var(--muted); font-size: 15px; margin-bottom: 12px; }
.turn { padding: 6px 0 6px 0; scroll-margin-top: 80px; border-radius: 6px; }
.turn .who { font: 500 11.5px/1.5 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.turn.interviewer .tx { color: var(--muted); }
.notes { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 4px; }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; font: 14px/1.5 var(--f); padding: 6px 10px; border-radius: 8px; }
.note .chip { font-size: 11.5px; }
.note small { display: block; color: var(--muted); font-size: 12.5px; }
.kp { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: var(--app); font-size: 14.5px; }
.kp ul { margin: 4px 0 0; padding-left: 18px; }
.srow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 6px 0; scroll-margin-top: 80px; border-radius: 6px; }
.srow .ref { font: 400 12px/2.2 var(--mono); color: var(--faint); text-align: right; }
.cues { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.cue { font: 500 11px/1.6 var(--mono); padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--muted); }
.src-h { margin: 22px 0 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.src-h:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
mark.hl { background: transparent; color: inherit; border-bottom: 2px solid currentColor; padding-bottom: 1px; }
mark.hl.t-pain_point { border-color: var(--pain); } mark.hl.t-bottleneck { border-color: var(--neck); } mark.hl.t-emotion { border-color: var(--emo); }
mark.hl.t-fact { border-color: var(--fact); } mark.hl.t-decision { border-color: var(--dec); } mark.hl.t-question { border-color: var(--q); }
mark.hl.t-opportunity { border-color: var(--opp); } mark.hl.t-quote { border-color: var(--quote); }
.flash { animation: flash 2.2s ease; }
@keyframes flash { 0%, 40% { background: var(--quote-bg); box-shadow: 0 0 0 6px var(--quote-bg); } 100% { background: transparent; box-shadow: 0 0 0 6px transparent; } }
.ev { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-strong); background: var(--doc); border-radius: 6px; padding: 0 6px; font: 500 11.5px/1.7 var(--mono); color: var(--muted); cursor: pointer; vertical-align: 1px; white-space: nowrap; }
.ev:hover { color: var(--ink); border-color: var(--ink); }
.glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; margin-top: 16px; }
.glance > div { padding: 12px 14px; outline: 1px solid var(--line); min-width: 0; }
.glance b { display: block; font-weight: 500; margin-top: 3px; font-size: 14.5px; overflow-wrap: anywhere; }
.flow { list-style: none; margin: 0; padding: 0; counter-reset: f; }
.flow li { position: relative; padding: 0 0 18px 34px; counter-increment: f; }
.flow li::before { content: counter(f); position: absolute; left: 0; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--sel); font: 500 11.5px/22px var(--mono); text-align: center; color: var(--muted); }
.flow h4 { font-size: 15.5px; font-weight: 600; margin-bottom: 2px; }
.topic { margin-bottom: 18px; }
.topic h4 { font-size: 15.5px; font-weight: 600; margin-bottom: 4px; }
.topic ul, .plain { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.quote { margin: 0 0 12px; padding: 12px 16px; border-left: 3px solid var(--quote); background: var(--quote-bg); border-radius: 0 10px 10px 0; }
.quote p { font-size: 16px; line-height: 1.5; }
.quote footer { margin-top: 6px; font-size: 13px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-card); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--app); padding: 9px 12px; white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
td.v { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.na { color: var(--faint); font-style: italic; font-weight: 400; }

/* Progress */
.progress-card { border: 1px solid var(--line); border-radius: var(--r-card); padding: clamp(18px, 3vw, 26px); margin-bottom: 26px; background: var(--doc); }
.progress-card h2 { font-size: 18px; font-weight: 600; margin: 6px 0 16px; }
.lbar { height: 10px; border-radius: 999px; background: var(--sel); overflow: hidden; }
.lbar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--btn); transition: width .5s ease; }
.lmeta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; margin-top: 10px; }
.lmeta b { font: 600 22px/1 var(--f); font-variant-numeric: tabular-nums; }
.lmeta span { color: var(--muted); font-size: 14px; }
.lsteps { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
.lsteps li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; color: var(--faint); font-size: 14.5px; }
.lsteps li::before { content: ""; box-sizing: border-box; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); margin-top: 2px; font: 700 11px/14px var(--f); text-align: center; color: var(--btn-ink); }
.lsteps li.done { color: var(--ink); } .lsteps li.done::before { content: "✓"; background: var(--btn); border-color: var(--btn); }
.lsteps li.now { color: var(--ink); font-weight: 500; } .lsteps li.now::before { border-color: var(--ink); border-right-color: transparent; animation: sp .9s linear infinite; }
.lsteps li.fail { color: var(--bad); } .lsteps li.fail::before { content: "!"; border-color: var(--bad); color: var(--bad); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: sp .9s linear infinite; display: inline-block; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }

/* DiagnosticCard */
.dcard { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--doc); }
.dcard > button.dhead { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 15px 18px; cursor: pointer; border-radius: var(--r-card); }
.dcard > button.dhead:focus-visible { outline: 2px solid var(--focus); }
.dtop { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.dcard h3 { font-size: 16px; font-weight: 600; line-height: 1.35; }
.dcard .impl { margin-top: 4px; color: var(--ink); }
.dcard .why { margin-top: 6px; font-size: 13.5px; color: var(--muted); }
.dcard .next { margin-top: 8px; font-size: 14px; } .dcard .next b { font-weight: 600; }
.dbody { padding: 0 18px 16px; border-top: 1px solid var(--line); }
.dbody h4 { font: 500 11px/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
.evq { padding: 8px 12px; border-radius: 8px; background: var(--app); font-size: 14.5px; margin-bottom: 6px; }
.evq footer { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.dactions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.comment { font-size: 14px; padding: 8px 0; border-top: 1px solid var(--line); }
.comment small { color: var(--muted); }
.queues { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
@media (max-width: 980px) { .queues { grid-template-columns: minmax(0, 1fr); } }
.qh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.qh h2 { font-size: 16px; font-weight: 600; }

/* MetricCard */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mcard { border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; background: var(--doc); min-width: 0; }
.mval { font-size: 26px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.mcard h3 { font-size: 15px; font-weight: 600; line-height: 1.35; }
.mdef { color: var(--muted); font-size: 13.5px; }
.mwarn { font-size: 13.5px; margin-top: 6px; padding: 7px 10px; border-radius: 8px; background: var(--app); color: var(--muted); }
.mwarn.shaky { background: var(--warn-bg); color: var(--ink); }
.mwarn b { font-weight: 600; }
.mfoot { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--faint); }
/* Tasks */
.task { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px 16px; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--btn); }
.task.done .tt { text-decoration: line-through; color: var(--muted); }
.task small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }

/* New memo */
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r-card); padding: 24px 16px; text-align: center; cursor: pointer; background: var(--app); }
.drop:hover, .drop.over { border-color: var(--ink); }
.drop b { display: block; font-weight: 600; font-size: 15.5px; }
.drop p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.fmt { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 10px; }
.fmt span { font: 500 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); background: var(--doc); }
.srcs { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.src { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.src .nm { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src .st { font-size: 12.5px; color: var(--muted); } .src .st.bad { color: var(--bad); }
.src .bar2 { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--sel); overflow: hidden; } .src .bar2 i { display: block; height: 100%; background: var(--btn); transition: width .3s; }
.src details { grid-column: 1 / -1; font-size: 13px; } .src pre { white-space: pre-wrap; font: 12.5px/1.55 var(--mono); max-height: 200px; overflow: auto; background: var(--app); padding: 10px; border-radius: 6px; margin: 6px 0 0; }
.dest { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 14px 16px; border-radius: var(--r-card); background: var(--sel); margin-bottom: 18px; }
.dest b { font-size: 16px; }
.ios { padding: 12px 14px; border-radius: 10px; background: var(--app); font-size: 13.5px; margin-top: 12px; }
.ios ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }

/* ---------- StarwellAssistant ---------- */
.apanel { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--assist); border: 1px solid var(--line); border-radius: var(--r-panel); box-shadow: var(--shadow); overflow: hidden; }
.a-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px 18px; }
.a-head h2 { font-size: 16px; font-weight: 600; margin-right: auto; display: flex; gap: 8px; align-items: center; }
.a-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; font: 700 12px/1 var(--f); }
.a-scope { padding: 0 18px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
.a-scope .seg { align-self: flex-start; }
.a-msgs { flex: 1; overflow: auto; padding: 6px 18px 14px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.a-start { display: grid; gap: 6px; margin-top: 4px; }
.a-start button { text-align: left; border: 1px solid var(--line-strong); background: var(--doc); border-radius: 12px; padding: 9px 12px; cursor: pointer; font-size: 14px; }
.a-start button:hover { border-color: var(--ink); }
.a-start small { display: block; color: var(--muted); font-size: 12.5px; }
.u-msg { align-self: flex-end; max-width: 92%; background: var(--doc); border: 1px solid var(--line); border-radius: 16px 16px 4px 16px; padding: 10px 13px; font-size: 14.5px; }
.u-msg blockquote { margin: 0 0 6px; padding: 6px 10px; border-left: 2px solid var(--line-strong); color: var(--muted); font-size: 13px; }
.a-msg { font-size: 14.5px; line-height: 1.55; }
.a-msg h4 { font-size: 13px; font-weight: 600; margin: 12px 0 2px; }
.a-msg h4:first-child { margin-top: 0; }
.a-msg .claims { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px; }
.a-msg .claims li { display: grid; gap: 3px; }
.a-msg details { margin-top: 10px; } .a-msg summary { cursor: pointer; font-size: 13.5px; color: var(--muted); }
.a-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.a-think { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.a-comp { padding: 10px 12px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.a-box { background: var(--doc); border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 8px 12px; }
.a-chip { display: flex; gap: 8px; align-items: flex-start; background: var(--app); border-radius: 8px; padding: 6px 6px 6px 10px; margin-bottom: 6px; font-size: 12.5px; }
.a-chip span { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.a-chip b { color: var(--ink); font-weight: 600; }
.a-row { display: flex; gap: 8px; align-items: flex-end; }
.a-row textarea { flex: 1; border: 0; background: transparent; resize: none; min-height: 24px; max-height: 160px; padding: 6px 0; line-height: 1.45; font-size: 15px; }
.a-row textarea:focus { outline: none; }
.send { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.send:disabled { opacity: .35; cursor: not-allowed; }
.a-foot { font-size: 11.5px; color: var(--faint); text-align: center; margin-top: 6px; }

/* SelectionToolbar */
.selbar { position: fixed; z-index: 50; display: flex; gap: 2px; padding: 4px; background: var(--btn); color: var(--btn-ink); border-radius: 10px; box-shadow: var(--shadow); }
.selbar button { border: 0; background: transparent; color: inherit; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.selbar button:hover { background: rgba(127,127,127,.25); }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--btn); color: var(--btn-ink); padding: 10px 16px; border-radius: 9px; font-size: 14px; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* ---------- Responsive ---------- */
@media (max-width: 1199px) {
  .app, .app.no-assist { grid-template-columns: var(--side-w) minmax(0, 1fr); }
  .assist { position: fixed; z-index: 35; top: 0; right: 0; bottom: 0; width: min(420px, 100%); padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 10px 10px; transform: translateX(105%); transition: transform .25s ease; display: flex !important; }
  .app.assist-open .assist { transform: none; }
}
@media (max-width: 899px) {
  .app, .app.no-assist { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 36; top: 0; bottom: 0; left: 0; width: min(300px, 88vw); transform: translateX(-105%); transition: transform .25s ease; padding-top: max(14px, env(safe-area-inset-top, 0px)); box-shadow: var(--shadow); }
  .app.side-open .side { transform: none; }
  .menu-btn { display: inline-grid; }
  .ask-btn .lbl { display: none; }
  .search kbd { display: none; }
  .search input { padding-right: 14px; }
}
@media (max-width: 599px) {
  .assist { width: 100%; padding: 0; }
  .apanel { border-radius: 0; border: 0; }
  .a-head { padding-top: max(14px, env(safe-area-inset-top, 0px)); }
  .view { padding-top: 22px; }
  .doc { font-size: 16px; }
  .srow { grid-template-columns: 46px minmax(0, 1fr); gap: 10px; }
  .notefilter { margin-left: 0; }
  .viewbar .seg { flex-wrap: nowrap; max-width: 100%; overflow-x: auto; }
  .viewbar { flex-wrap: wrap; row-gap: 4px; }
  .vtabs { flex: 1 1 100%; gap: 18px; }
  .viewbar .menu-wrap { margin-left: -10px; }

// Routing: #c-<company>[-memos|-diagnostics|-metrics|-actions] · #m-<memo>[-view] · #new · #unassigned
// =====================================================================================
function parseRoute() {
  const hsh = location.hash.slice(1);
  let m;
  if (hsh === "new") return { name: "new" };
  if (hsh === "unassigned") return { name: "unassigned" };
  if (hsh === "team") return { name: "team" };
  if (hsh === "mine") return { name: "mine" };
  if ((m = /^m-([a-z0-9]+)$/.exec(hsh))) return { name: "memo", id: m[1] };
  if ((m = /^c-([a-z0-9]+)(?:-(memos|diagnostics|metrics|actions))?$/.exec(hsh))) return { name: m[2] || "overview", cid: m[1] };
  return { name: "overview", cid: S.cid };
}
